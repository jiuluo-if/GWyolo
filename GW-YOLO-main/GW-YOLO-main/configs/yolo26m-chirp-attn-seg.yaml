# 针对引力波时频 chirp 调整的 YOLO26m 分割模型。
# Chirp 微弱、细长、弯曲且具有方向性。P3 保留轨迹细节，P4 提供上下文；C2PSA
# 残差位置敏感注意力在保留局部细节的同时连接同一曲线的分离部分。
nc: 2
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
# 在 imgsz=640 时 P3 为 80×80，因此只保留一个自注意力块：足以连接细轨迹，
# 同时避免深层堆叠的二次显存代价。P4 的空间成本更低，使用两个块提供弯曲轨迹上下文。
  - [16, 1, C2PSA, [256]]
  - [19, 2, C2PSA, [512]]
  - [[23, 24, 22], 1, Segment26, [nc, 32, 256]]
